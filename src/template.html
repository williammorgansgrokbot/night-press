<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Night Press — Pecan Branch Lot</title>
  <style>/*CSS*/</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="title">NIGHT PRESS</div>
    <div id="sub">Pecan Branch Mall · Dallas</div>
    <button id="mute" type="button" aria-label="Mute">SOUND ON</button>
    <button id="vr" type="button" hidden>ENTER VR</button>
  </div>
  <div id="load"><div id="loadbar"><i id="loadfill"></i></div><div id="loadtxt">Loading the lot…</div></div>
  <div id="stickMove" class="stick" aria-hidden="true"><i></i></div>
  <div id="lookPad" aria-hidden="true"></div>
  <button id="prompt" type="button" hidden>ENTER RIDE</button>
  <div id="panelBar" hidden>
    <button type="button" data-act="power">POWER</button>
    <button type="button" data-act="lights">LIGHTS</button>
    <button type="button" data-act="horn">HORN</button>
    <button type="button" data-act="start">START</button>
    <button type="button" data-act="back">BACK</button>
  </div>
  <script>/*SCRIPT*/</script>
</body>
</html>
